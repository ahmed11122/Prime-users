<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة حسابات العملاء</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0f1416;
    --panel: #161d20;
    --panel-2: #1c2427;
    --line: #26302f;
    --ink: #eef2f0;
    --ink-dim: #9fb0ab;
    --accent: #3fae7a;
    --accent-2: #2e8c62;
    --amber: #d9a441;
    --red: #c85c4a;
    --radius: 10px;
  }

  html[data-theme="light"]{
    --bg: #f4f6f5;
    --panel: #ffffff;
    --panel-2: #eef1f0;
    --line: #dde3e1;
    --ink: #16201d;
    --ink-dim: #5c6a65;
    --accent: #2e8c62;
    --accent-2: #256f4e;
    --amber: #b5791f;
    --red: #b5453a;
  }

  .user-name{
    font-family:'Tajawal'; font-size:13.5px; color: var(--ink); font-weight:700;
  }

  .theme-toggle{
    display:flex; align-items:center; gap:6px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:20px;
    padding:6px 6px; cursor:pointer; font-family:'Tajawal';
  }
  .theme-toggle button{
    border:none; background:transparent; color: var(--ink-dim); cursor:pointer;
    padding:6px 12px; border-radius:16px; font-size:12px; font-weight:700; font-family:'Tajawal';
  }
  .theme-toggle button.active{ background: var(--accent); color:#08130d; }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    min-height:100vh;
    padding: 32px 20px 80px;
    transition: background .2s ease, color .2s ease;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom: 28px; gap:16px; flex-wrap:wrap;
  }
  header .title-block{ display:flex; flex-direction:column; gap:4px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.12em;
    color: var(--accent); text-transform:uppercase;
  }
  h1{ margin:0; font-size:28px; font-weight:900; }
  .stats{
    display:flex; gap:10px; font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .stat{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 10px 16px; text-align:center; min-width:84px;
  }
  .stat b{ display:block; font-size:20px; color:var(--accent); font-weight:700; }
  .stat span{ color: var(--ink-dim); font-size:11px; }

  .toolbar{
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:14px;
    border-radius: 8px; border:1px solid var(--line); cursor:pointer;
    padding: 10px 18px; background: var(--panel-2); color: var(--ink);
    transition: all .15s ease;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color:#08130d; }
  .btn.primary:hover{ background: var(--accent-2); }
  .btn.ghost{ background:transparent; }
  .btn:active{ transform: scale(.97); }

  .search{
    flex:1; min-width:200px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 10px 14px; color: var(--ink); font-family:'Tajawal'; font-size:14px;
  }
  .search::placeholder{ color: var(--ink-dim); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .employee{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    margin-bottom: 16px; overflow:hidden;
  }
  .employee-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px; cursor:pointer; gap:12px; flex-wrap:wrap;
  }
  .employee-name{
    display:flex; align-items:center; gap:12px; font-size:17px; font-weight:700;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; background: var(--panel-2);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono';
    font-size:14px; color: var(--accent); border:1px solid var(--line); flex-shrink:0;
  }
  .progress-mini{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-dim);
    display:flex; align-items:center; gap:8px;
  }
  .bar{ width:90px; height:6px; border-radius:4px; background: var(--panel-2); overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; background: var(--accent); transition: width .3s ease; }

  .head-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color: var(--red); color: var(--red); }
  .chevron{ transition: transform .2s ease; color: var(--ink-dim); }
  .employee.open .chevron{ transform: rotate(180deg); }

  .accounts{
    display:none; padding: 0 20px 18px; border-top:1px solid var(--line);
  }
  .employee.open .accounts{ display:block; }

  .account-row{
    display:flex; align-items:center; gap:10px; padding: 12px 0;
    border-bottom: 1px dashed var(--line); flex-wrap:wrap;
  }
  .account-row:last-of-type{ border-bottom:none; }

  .account-row.checked{ opacity:.55; }

  .cred{
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding: 8px 12px; display:flex; align-items:center; gap:8px; flex:1; min-width:160px;
  }
  .cred .label{ color: var(--ink-dim); font-size:11px; }
  .cred .val{ color: var(--ink); }

  .copy-btn{
    background: transparent; border:1px solid var(--line); color: var(--accent);
    border-radius:6px; padding:8px 10px; cursor:pointer; font-size:12px;
    font-family:'Tajawal'; font-weight:700;
  }
  .copy-btn:hover{ background: var(--accent); color:#08130d; }
  .copy-btn.copied{ background: var(--accent); color:#08130d; }

  .toggle-status{
    border:1px solid var(--line); border-radius: 20px; padding: 7px 14px;
    cursor:pointer; font-size:12px; font-weight:700; font-family:'Tajawal';
    display:flex; align-items:center; gap:6px; background:var(--panel-2); color:var(--ink-dim);
    white-space:nowrap;
  }
  .toggle-status .dot{ width:8px; height:8px; border-radius:50%; background: var(--ink-dim); }
  .toggle-status.done{ border-color: var(--accent); color: var(--accent); }
  .toggle-status.done .dot{ background: var(--accent); }

  .del-account{
    background:transparent; border:none; color: var(--ink-dim); cursor:pointer;
    font-size:16px; width:28px; height:28px; border-radius:6px;
  }
  .del-account:hover{ color: var(--red); background: rgba(200,92,74,.1); }

  .add-account-row{
    display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .add-account-row input{
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding: 9px 12px; color: var(--ink); font-family:'IBM Plex Mono', monospace;
    font-size:13px; flex:1; min-width:130px;
  }
  .add-account-row input:focus{ outline:none; border-color:var(--accent); }

  .time-badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-dim);
    background: var(--panel-2); border:1px solid var(--line); border-radius:20px;
    padding: 5px 10px; white-space:nowrap;
  }

  .reminders-box{ margin: 10px 0; display:flex; flex-direction:column; gap:6px; }
  .reminder-line{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: rgba(217,164,65,.1); border:1px solid var(--amber); color: var(--ink);
    border-radius:8px; padding:8px 12px; font-size:12.5px;
  }
  .reminder-line span:first-of-type{ flex:1; }

  .empty-accounts{
    color: var(--ink-dim); font-size:13px; padding: 16px 0; text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--ink-dim);
  }
  .empty-state .big{ font-size:40px; margin-bottom:12px; }

  .alert-banner{
    display:none; align-items:center; gap:12px;
    background: rgba(217,164,65,.12); border:1px solid var(--amber); color: var(--amber);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; font-size:14px;
  }
  .alert-banner.show{ display:flex; }
  .alert-banner .ico{ font-size:20px; flex-shrink:0; }
  .alert-banner .txt b{ font-weight:900; }
  .alert-banner .txt div{ color: var(--ink-dim); font-size:12.5px; margin-top:2px; }

  .account-row:not(.checked){
    border-right: 3px solid var(--amber); padding-right:10px;
  }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background: rgba(0,0,0,.6);
    align-items:center; justify-content:center; z-index:50; padding:20px;
    overflow-y:auto;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 24px; width:100%; max-width:360px;
    max-height: calc(100vh - 40px); overflow-y:auto; box-sizing:border-box;
    margin: auto;
  }
  .modal h3{ margin:0 0 16px; font-size:17px; }
  .modal input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 11px 14px; color: var(--ink); font-family:'Tajawal'; font-size:14px; margin-bottom:12px;
  }
  .modal input:focus{ outline:none; border-color: var(--accent); }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--accent); color:#08130d; padding: 10px 20px; border-radius:8px;
    font-weight:700; font-size:13px; opacity:0; pointer-events:none; transition: all .25s ease;
    z-index:100; font-family:'Tajawal';
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:640px){
    body{ padding: 20px 12px 70px; }
    header{ flex-direction:column; align-items:stretch; gap:14px; }
    h1{ font-size:22px; }
    .stats{
      display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; width:100%;
    }
    .stat{ min-width:0; padding:10px 6px; }
    .stat b{ font-size:17px; }
    .stat span{ font-size:10px; }

    #appWrap > div[style*="flex-end"]{
      justify-content:space-between !important;
    }
    .user-name{ font-size:12.5px; }

    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar .search{ order:-1; width:100%; }
    .toolbar .btn{ flex:1; text-align:center; }

    .employee-head{ padding:14px 14px; }
    .employee-name{ font-size:15px; }
    .progress-mini{ font-size:11px; }
    .bar{ width:60px; }

    .cred{ min-width:0; width:100%; }
    .account-row{ gap:8px; }
    .time-badge{ font-size:10px; padding:4px 8px; }

    .modal{ width:92vw; padding:20px; }
  }

  @media (max-width:400px){
    .stats{ grid-template-columns: repeat(2, 1fr); }
  }

  /* ---- Roles / Admin panel ---- */
  .role-badge{
    font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:20px; border:1px solid var(--line);
    color: var(--ink-dim); text-transform:uppercase; letter-spacing:.05em;
  }
  .role-badge.admin{ color:var(--red); border-color:var(--red); }
  .role-badge.manager{ color:var(--amber); border-color:var(--amber); }
  .role-badge.employee{ color:var(--accent); border-color:var(--accent); }

  .modal.wide{ max-width:560px; }
  .modal select{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 11px 14px; color: var(--ink); font-family:'Tajawal'; font-size:14px; margin-bottom:12px;
  }
  .modal select:focus{ outline:none; border-color: var(--accent); }

  .user-row{
    display:flex; align-items:center; gap:10px; padding:12px 0;
    border-bottom:1px dashed var(--line); flex-wrap:wrap;
  }
  .user-row:last-of-type{ border-bottom:none; }
  .user-row .uinfo{ flex:1; min-width:150px; }
  .user-row .uinfo .uname{ font-weight:700; font-size:14px; }
  .user-row .uinfo .uemail{ color:var(--ink-dim); font-size:12px; font-family:'IBM Plex Mono', monospace; }
  .user-row select{
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding:7px 10px; color:var(--ink); font-family:'Tajawal'; font-size:13px;
  }

  .add-user-box{
    background: var(--panel-2); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:16px;
  }
  .add-user-box h4{ margin:0 0 10px; font-size:13px; color:var(--ink-dim); }

  .users-list{ max-height:320px; overflow-y:auto; margin-top:6px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<!-- Login screen -->
<div class="modal-backdrop show" id="loginScreen">
  <div class="modal" style="max-width:340px;">
    <h3>تسجيل الدخول</h3>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
    <div id="loginError" style="color:var(--red); font-size:13px; margin-bottom:10px; display:none;"></div>
    <div class="modal-actions">
      <button class="btn primary" id="loginBtn" style="width:100%;">دخول</button>
    </div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <div style="display:flex; justify-content:flex-end; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
    <div class="theme-toggle" id="themeToggle">
      <button data-theme-choice="dark" id="darkBtn">🌙 داكن</button>
      <button data-theme-choice="light" id="lightBtn">☀️ فاتح</button>
    </div>
    <span class="user-name" id="myUserName"></span>
    <span class="role-badge" id="myRoleBadge"></span>
    <button class="btn ghost hidden" id="manageUsersBtn">👤 إدارة المستخدمين</button>
    <button class="btn ghost" id="logoutBtn">تسجيل الخروج</button>
  </div>
  <header>
    <div class="title-block">
      <span class="eyebrow">متابعة يومية · Account Check</span>
      <h1>متابعة حسابات العملاء</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>إجمالي الحسابات</span></div>
      <div class="stat"><b id="statDone">0</b><span>تم الفحص</span></div>
      <div class="stat"><b id="statPending">0</b><span>متبقي</span></div>
      <div class="stat"><b id="statAvg">—</b><span>متوسط وقت الإنجاز</span></div>
    </div>
  </header>

  <div class="alert-banner" id="alertBanner">
    <span class="ico">⚠️</span>
    <div class="txt">
      <b id="alertHeadline"></b>
      <div id="alertDetail"></div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" id="searchBox" placeholder="ابحث عن عميل...">
    <button class="btn primary" id="addEmployeeBtn">+ إضافة عميل</button>
    <button class="btn ghost" id="expandAllBtn">توسيع الكل</button>
    <button class="btn ghost" id="collapseAllBtn">طي الكل</button>
  </div>

  <div id="employeeList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">👥</div>
    لا يوجد عملاء بعد — ابدأ بإضافة أول عميل
  </div>
</div>

<div class="modal-backdrop" id="employeeModal">
  <div class="modal">
    <h3>إضافة عميل جديد</h3>
    <input type="text" id="newEmployeeName" placeholder="اسم العميل">
    <div class="modal-actions">
      <button class="btn ghost" id="cancelEmployee">إلغاء</button>
      <button class="btn primary" id="confirmEmployee">إضافة</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="usersModal">
  <div class="modal wide">
    <h3>إدارة المستخدمين</h3>

    <div class="add-user-box">
      <h4>إضافة مستخدم جديد</h4>
      <input type="text" id="newUserName" placeholder="الاسم">
      <input type="email" id="newUserEmail" placeholder="البريد الإلكتروني" autocomplete="off">
      <input type="password" id="newUserPassword" placeholder="كلمة المرور (6 أحرف على الأقل)" autocomplete="new-password">
      <select id="newUserRole">
        <option value="employee">موظف — عرض وفحص فقط</option>
        <option value="manager">مدير — صلاحيات كاملة</option>
        <option value="admin">أدمن — صلاحيات كاملة</option>
      </select>
      <div id="newUserError" style="color:var(--red); font-size:13px; margin-bottom:10px; display:none;"></div>
      <button class="btn primary" id="createUserBtn" style="width:100%;">+ إنشاء مستخدم</button>
    </div>

    <div class="users-list" id="usersList"></div>

    <div class="modal-actions">
      <button class="btn ghost" id="closeUsersModal">إغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getDatabase, ref, set, remove, onValue, get, update
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

// ---- Theme (light/dark) — local to this device, no login required ----
(function initTheme(){
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeButtons(saved);
})();

function updateThemeButtons(theme){
  document.getElementById('darkBtn').classList.toggle('active', theme === 'dark');
  document.getElementById('lightBtn').classList.toggle('active', theme === 'light');
}

document.querySelectorAll('[data-theme-choice]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const theme = btn.dataset.themeChoice;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    updateThemeButtons(theme);
  });
});

const firebaseConfig = {
  apiKey: "AIzaSyATtx8iZOzOuox2DR3wTqMDtRlAWDiWbrs",
  authDomain: "prime-users.firebaseapp.com",
  databaseURL: "https://prime-users-default-rtdb.firebaseio.com",
  projectId: "prime-users",
  storageBucket: "prime-users.firebasestorage.app",
  messagingSenderId: "643551414414",
  appId: "1:643551414414:web:045a53d9ed7fa23324a1df",
  measurementId: "G-T7E4FV9GGJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

// The whole clients/accounts list lives at a single RTDB path.
const dataRef = ref(db, 'appData/employees');
const usersRef = ref(db, 'users');

let employees = [];
let openState = {};
let unsubscribeSnapshot = null;
let unsubscribeUsers = null;
let unsubscribeSession = null;
let mySessionId = null;
let forcedLogout = false;

function getDeviceSessionId(){
  // Persisted per browser/device install so a page refresh on the SAME
  // device doesn't look like a new device logging in.
  let id = localStorage.getItem('deviceSessionId');
  if(!id){
    id = uid() + uid();
    localStorage.setItem('deviceSessionId', id);
  }
  return id;
}
let isRemoteUpdate = false; // guard so our own writes don't re-trigger a jarring reload

let currentUid = null;
let currentRole = null; // 'admin' | 'manager' | 'employee'
let currentUserName = '';
let usersCache = [];

function canEdit(){
  // admin + manager have full edit rights; employee is view + check only
  return currentRole === 'admin' || currentRole === 'manager';
}
function canManageUsers(){
  return currentRole === 'admin' || currentRole === 'manager';
}

function saveData(data){
  isRemoteUpdate = true;
  set(dataRef, { list: data })
    .then(()=>{
      showToast('✅ تم الحفظ في قاعدة البيانات');
    })
    .catch(err=>{
      console.error('Realtime Database save failed:', err);
      showToast('❌ فشل الحفظ، تحقق من الاتصال');
    });
}

// ---- Auth wiring ----
const loginScreen = document.getElementById('loginScreen');
const appWrap = document.getElementById('appWrap');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const logoutBtn = document.getElementById('logoutBtn');

loginBtn.addEventListener('click', doLogin);
loginPassword.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });

function doLogin(){
  loginError.style.display = 'none';
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if(!email || !password){
    loginError.textContent = 'أدخل البريد الإلكتروني وكلمة المرور';
    loginError.style.display = 'block';
    return;
  }
  loginBtn.disabled = true;
  signInWithEmailAndPassword(auth, email, password)
    .catch(err=>{
      loginError.textContent = 'فشل تسجيل الدخول: تحقق من البيانات';
      loginError.style.display = 'block';
    })
    .finally(()=>{ loginBtn.disabled = false; });
}

logoutBtn.addEventListener('click', ()=>{
  if(currentUid){
    remove(ref(db, 'sessions/' + currentUid)).catch(()=>{});
  }
  signOut(auth);
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    currentUid = user.uid;
    const myUserRef = ref(db, 'users/' + user.uid);
    onValue(myUserRef, (snap)=>{
      if(!snap.exists()){
        // No role assigned yet — deny access.
        loginError.textContent = 'حسابك غير مفعّل بعد. تواصل مع الأدمن لتفعيل صلاحيتك.';
        loginError.style.display = 'block';
        signOut(auth);
        return;
      }
      currentRole = snap.val().role || 'employee';
      currentUserName = snap.val().name || user.email || '';
      applyRoleToUI();
      loginScreen.classList.remove('show');
      appWrap.style.display = 'block';
      startListening();
      claimSession(user.uid);
    }, (err)=>{
      console.error('Role lookup failed:', err);
      loginError.textContent = 'تعذر التحقق من صلاحيات الحساب';
      loginError.style.display = 'block';
      signOut(auth);
    });
  } else {
    currentUid = null;
    currentRole = null;
    currentUserName = '';
    appWrap.style.display = 'none';
    loginScreen.classList.add('show');
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    if(unsubscribeUsers){ unsubscribeUsers(); unsubscribeUsers = null; }
    if(unsubscribeSession){ unsubscribeSession(); unsubscribeSession = null; }
    if(forcedLogout){
      forcedLogout = false;
      loginError.textContent = 'تم تسجيل الدخول بهذا الحساب من جهاز آخر، فتم تسجيل خروجك من هنا.';
      loginError.style.display = 'block';
    }
    employees = [];
  }
});

function claimSession(uidVal){
  mySessionId = getDeviceSessionId();
  const sessionRef = ref(db, 'sessions/' + uidVal);
  // Take the lock for this device — any other device holding it gets
  // notified through the listener below and signed out.
  set(sessionRef, { id: mySessionId, at: Date.now() }).catch(err=>{
    console.error('Session claim failed:', err);
  });
  if(unsubscribeSession) unsubscribeSession();
  unsubscribeSession = onValue(sessionRef, (snap)=>{
    const val = snap.val();
    if(val && val.id && val.id !== mySessionId){
      // Another device has taken over this account — sign out here.
      forcedLogout = true;
      signOut(auth);
    }
  });
}

function applyRoleToUI(){
  const badge = document.getElementById('myRoleBadge');
  const labels = { admin:'أدمن', manager:'مدير', employee:'موظف' };
  badge.textContent = labels[currentRole] || currentRole;
  badge.className = 'role-badge ' + currentRole;
  document.getElementById('myUserName').textContent = currentUserName ? `مرحباً، ${currentUserName}` : '';

  document.getElementById('manageUsersBtn').classList.toggle('hidden', !canManageUsers());
  document.getElementById('addEmployeeBtn').classList.toggle('hidden', !canEdit());
}

function startListening(){
  if(unsubscribeSnapshot) return;
  unsubscribeSnapshot = onValue(dataRef, (snap)=>{
    if(isRemoteUpdate){
      // this update is just confirming our own write; skip re-render to avoid flicker
      isRemoteUpdate = false;
      return;
    }
    const data = snap.exists() ? snap.val() : { list: [] };
    employees = data.list || [];
    render();
  }, (err)=>{
    console.error('Realtime Database listen failed:', err);
    showToast('تعذر تحميل البيانات');
  });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 1600);
}

function initials(name){
  const parts = name.trim().split(/\s+/);
  return parts.slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

// ---- Timing tracking ----
function formatDuration(ms){
  if(ms < 0) ms = 0;
  const mins = Math.floor(ms / 60000);
  if(mins < 60) return `${mins}د`;
  const hrs = Math.floor(mins / 60);
  const rem = mins % 60;
  return `${hrs}س ${rem}د`;
}
function formatClock(ts){
  const d = new Date(ts);
  return d.toLocaleString('ar', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
}

function computeAvgCompletionMs(){
  let total=0, count=0;
  employees.forEach(e => e.accounts.forEach(a=>{
    if(a.checked && a.checkedAt && a.createdAt){
      total += (a.checkedAt - a.createdAt);
      count++;
    }
  }));
  return count ? total/count : null;
}

function render(){
  const listEl = document.getElementById('employeeList');
  const emptyEl = document.getElementById('emptyState');
  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  const filtered = employees.filter(e => e.name.toLowerCase().includes(query));

  if(employees.length === 0){
    emptyEl.style.display = 'block';
    listEl.innerHTML = '';
  } else {
    emptyEl.style.display = 'none';
    listEl.innerHTML = filtered.map(emp => renderEmployee(emp)).join('');
  }

  // stats
  let total=0, done=0;
  employees.forEach(e => e.accounts.forEach(a => { total++; if(a.checked) done++; }));
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statPending').textContent = total - done;

  const avgMs = computeAvgCompletionMs();
  document.getElementById('statAvg').textContent = avgMs === null ? '—' : formatDuration(avgMs);

  updateAlertBanner();
  attachEvents();
}

function updateAlertBanner(){
  const banner = document.getElementById('alertBanner');
  const pendingByEmp = employees
    .map(e => ({ name: e.name, count: e.accounts.filter(a=>!a.checked).length }))
    .filter(e => e.count > 0);

  const totalPending = pendingByEmp.reduce((s,e)=>s+e.count, 0);

  if(totalPending === 0){
    banner.classList.remove('show');
    return;
  }

  document.getElementById('alertHeadline').textContent =
    `يوجد ${totalPending} حساب لم يتم فحصه بعد`;
  document.getElementById('alertDetail').textContent =
    pendingByEmp.map(e => `${e.name} (${e.count})`).join(' · ');
  banner.classList.add('show');
}

function renderEmployee(emp){
  const isOpen = !!openState[emp.id];
  const total = emp.accounts.length;
  const done = emp.accounts.filter(a=>a.checked).length;
  const pct = total ? Math.round((done/total)*100) : 0;
  const editable = canEdit();

  const now = Date.now();

  const accountsHtml = emp.accounts.length ? emp.accounts.map(acc => {
    const created = acc.createdAt || null;
    let timingHtml = '';
    if(acc.checked){
      if(acc.checkedAt && created){
        timingHtml = `<span class="time-badge" title="وقت الإنجاز">⏱ ${formatDuration(acc.checkedAt - created)}</span>`;
      }
    } else if(created){
      timingHtml = `<span class="time-badge" title="منذ الإضافة">⏳ ${formatDuration(now - created)}</span>`;
    }
    return `
    <div class="account-row ${acc.checked?'checked':''}" data-emp="${emp.id}" data-acc="${acc.id}">
      <div class="cred">
        <span class="label">اسم المستخدم</span>
        <span class="val">${escapeHtml(acc.username)}</span>
        <button class="copy-btn" data-copy="${escapeAttr(acc.username)}">نسخ</button>
      </div>
      <div class="cred">
        <span class="label">كلمة المرور</span>
        <span class="val">${escapeHtml(acc.password)}</span>
        <button class="copy-btn" data-copy="${escapeAttr(acc.password)}">نسخ</button>
      </div>
      ${timingHtml}
      <button class="toggle-status ${acc.checked?'done':''}" data-emp="${emp.id}" data-acc="${acc.id}" data-action="toggle">
        <span class="dot"></span> ${acc.checked ? 'تم الفحص' : 'لم يُفحص'}
      </button>
      ${editable ? `<button class="del-account" data-emp="${emp.id}" data-acc="${acc.id}" data-action="delAccount" title="حذف الحساب">✕</button>` : ''}
    </div>
  `;
  }).join('') : `<div class="empty-accounts">لا توجد حسابات لهذا العميل بعد</div>`;

  const reminders = (emp.reminders || []).slice(-3).reverse();
  const remindersHtml = reminders.length ? `
    <div class="reminders-box">
      ${reminders.map(r => `<div class="reminder-line">🔔 <span>${escapeHtml(r.msg)}</span> <span class="time-badge">${formatClock(r.at)}</span></div>`).join('')}
    </div>` : '';

  return `
    <div class="employee ${isOpen?'open':''}" data-emp="${emp.id}">
      <div class="employee-head" data-action="toggleEmployee" data-emp="${emp.id}">
        <div class="employee-name">
          <div class="avatar">${initials(emp.name)}</div>
          <span>${escapeHtml(emp.name)}</span>
        </div>
        <div class="progress-mini">
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span>${done}/${total}</span>
          <span class="chevron">▾</span>
        </div>
        <div class="head-actions">
          ${editable ? `<button class="icon-btn" data-action="sendReminder" data-emp="${emp.id}" title="إرسال تنبيه بخصوص العميل">🔔</button>` : ''}
          ${editable ? `<button class="icon-btn" data-action="deleteEmployee" data-emp="${emp.id}" title="حذف العميل">🗑</button>` : ''}
        </div>
      </div>
      <div class="accounts">
        ${remindersHtml}
        ${accountsHtml}
        ${editable ? `
        <div class="add-account-row">
          <input type="text" placeholder="اسم المستخدم" class="newUsername" data-emp="${emp.id}">
          <input type="text" placeholder="كلمة المرور" class="newPassword" data-emp="${emp.id}">
          <button class="btn primary" data-action="addAccount" data-emp="${emp.id}">+ إضافة حساب</button>
        </div>` : ''}
      </div>
    </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

function attachEvents(){
  document.querySelectorAll('[data-action="toggleEmployee"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.icon-btn')) return;
      const id = el.dataset.emp;
      openState[id] = !openState[id];
      render();
    });
  });

  document.querySelectorAll('[data-action="sendReminder"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.dataset.emp;
      const emp = employees.find(x=>x.id===id);
      const pending = emp.accounts.filter(a=>!a.checked).length;
      const defaultMsg = pending > 0
        ? `الرجاء الإسراع في إنجاز الحسابات المتبقية (${pending} حساب لم يُفحص بعد)`
        : 'الرجاء تسريع وتيرة العمل';
      const msg = prompt('نص التنبيه:', defaultMsg);
      if(msg === null) return; // cancelled
      if(!emp.reminders) emp.reminders = [];
      emp.reminders.push({ id: uid(), msg: msg.trim() || defaultMsg, at: Date.now() });
      saveData(employees);
      render();
      showToast('تم إرسال التنبيه لـ ' + emp.name);
    });
  });

  document.querySelectorAll('[data-action="deleteEmployee"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.dataset.emp;
      const emp = employees.find(x=>x.id===id);
      if(confirm(`هل تريد حذف "${emp.name}" وكل حساباته؟`)){
        employees = employees.filter(x=>x.id!==id);
        saveData(employees);
        render();
        showToast('تم حذف العميل');
      }
    });
  });

  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp, accId = el.dataset.acc;
      const emp = employees.find(x=>x.id===empId);
      const acc = emp.accounts.find(x=>x.id===accId);
      acc.checked = !acc.checked;
      acc.checkedAt = acc.checked ? Date.now() : null;
      if(!acc.createdAt) acc.createdAt = Date.now(); // backfill for older records
      saveData(employees);
      render();
    });
  });

  document.querySelectorAll('[data-action="delAccount"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp, accId = el.dataset.acc;
      const emp = employees.find(x=>x.id===empId);
      emp.accounts = emp.accounts.filter(x=>x.id!==accId);
      saveData(employees);
      render();
      showToast('تم حذف الحساب');
    });
  });

  document.querySelectorAll('.copy-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const text = el.dataset.copy;
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      const original = el.textContent;
      el.textContent = 'تم!';
      el.classList.add('copied');
      setTimeout(()=>{ el.textContent = original; el.classList.remove('copied'); }, 1200);
    });
  });

  document.querySelectorAll('[data-action="addAccount"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp;
      const uInput = document.querySelector(`.newUsername[data-emp="${empId}"]`);
      const pInput = document.querySelector(`.newPassword[data-emp="${empId}"]`);
      const username = uInput.value.trim();
      const password = pInput.value.trim();
      if(!username || !password){
        showToast('أدخل اسم المستخدم وكلمة المرور');
        return;
      }
      const emp = employees.find(x=>x.id===empId);
      emp.accounts.push({ id: uid(), username, password, checked:false, createdAt: Date.now(), checkedAt: null });
      saveData(employees);
      openState[empId] = true;
      render();
      showToast('تمت إضافة الحساب');
    });
  });

  // allow Enter key to submit account
  document.querySelectorAll('.newUsername, .newPassword').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        const empId = inp.dataset.emp;
        document.querySelector(`[data-action="addAccount"][data-emp="${empId}"]`).click();
      }
    });
  });
}

// Add employee modal
const modal = document.getElementById('employeeModal');
document.getElementById('addEmployeeBtn').addEventListener('click', ()=>{
  modal.classList.add('show');
  document.getElementById('newEmployeeName').value = '';
  document.getElementById('newEmployeeName').focus();
});
document.getElementById('cancelEmployee').addEventListener('click', ()=>{
  modal.classList.remove('show');
});
modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.classList.remove('show'); });

document.getElementById('confirmEmployee').addEventListener('click', addEmployee);
document.getElementById('newEmployeeName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') addEmployee();
});

function addEmployee(){
  const name = document.getElementById('newEmployeeName').value.trim();
  if(!name){ showToast('أدخل اسم العميل'); return; }
  employees.push({ id: uid(), name, accounts: [], reminders: [] });
  saveData(employees);
  modal.classList.remove('show');
  render();
  showToast('تمت إضافة العميل');
}

document.getElementById('searchBox').addEventListener('input', render);

// Re-render periodically so "pending since" timers stay current
// even if nobody touches the page.
setInterval(()=>{ if(employees.length) render(); }, 30000);

document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  employees.forEach(e => openState[e.id] = true);
  render();
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  openState = {};
  render();
});

// ---- Users / roles management ----
const usersModal = document.getElementById('usersModal');
const newUserError = document.getElementById('newUserError');

document.getElementById('manageUsersBtn').addEventListener('click', ()=>{
  if(!canManageUsers()) return;
  usersModal.classList.add('show');
  document.getElementById('newUserName').value = '';
  document.getElementById('newUserEmail').value = '';
  document.getElementById('newUserPassword').value = '';
  newUserError.style.display = 'none';
  startListeningUsers();
});
document.getElementById('closeUsersModal').addEventListener('click', ()=>{
  usersModal.classList.remove('show');
});
usersModal.addEventListener('click', (e)=>{ if(e.target === usersModal) usersModal.classList.remove('show'); });

function startListeningUsers(){
  if(unsubscribeUsers) return;
  unsubscribeUsers = onValue(usersRef, (snap)=>{
    const val = snap.val() || {};
    usersCache = Object.keys(val).map(id => ({ id, ...val[id] }));
    renderUsers();
  }, (err)=>{
    console.error('Users listen failed:', err);
    showToast('تعذر تحميل قائمة المستخدمين');
  });
}

function renderUsers(){
  const list = document.getElementById('usersList');
  if(usersCache.length === 0){
    list.innerHTML = `<div class="empty-accounts">لا يوجد مستخدمون بعد</div>`;
    return;
  }
  const roleLabels = { admin:'أدمن', manager:'مدير', employee:'موظف' };
  list.innerHTML = usersCache.map(u => `
    <div class="user-row">
      <div class="uinfo">
        <div class="uname">${escapeHtml(u.name || '(بدون اسم)')} ${u.id === currentUid ? '· أنت' : ''}</div>
        <div class="uemail">${escapeHtml(u.email || '')}</div>
      </div>
      <select data-action="changeRole" data-uid="${u.id}" ${u.id === currentUid ? 'disabled' : ''}>
        <option value="employee" ${u.role==='employee'?'selected':''}>${roleLabels.employee}</option>
        <option value="manager" ${u.role==='manager'?'selected':''}>${roleLabels.manager}</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>${roleLabels.admin}</option>
      </select>
      <button class="icon-btn" data-action="removeUser" data-uid="${u.id}" title="إلغاء تفعيل الحساب" ${u.id === currentUid ? 'disabled' : ''}>🗑</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-action="changeRole"]').forEach(el=>{
    el.addEventListener('change', async ()=>{
      const uid = el.dataset.uid;
      try{
        await update(ref(db, 'users/' + uid), { role: el.value });
        showToast('تم تحديث الصلاحية');
      }catch(err){
        console.error(err);
        showToast('فشل تحديث الصلاحية');
      }
    });
  });

  list.querySelectorAll('[data-action="removeUser"]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const uid = el.dataset.uid;
      const u = usersCache.find(x=>x.id===uid);
      if(!confirm(`إلغاء تفعيل حساب "${u?.name || u?.email}"؟ لن يتمكن من الدخول بعد الآن.`)) return;
      try{
        await remove(ref(db, 'users/' + uid));
        showToast('تم إلغاء تفعيل الحساب');
      }catch(err){
        console.error(err);
        showToast('فشل إلغاء التفعيل');
      }
    });
  });
}

document.getElementById('createUserBtn').addEventListener('click', createUser);

async function createUser(){
  const name = document.getElementById('newUserName').value.trim();
  const email = document.getElementById('newUserEmail').value.trim();
  const password = document.getElementById('newUserPassword').value;
  const role = document.getElementById('newUserRole').value;
  newUserError.style.display = 'none';

  if(!name || !email || !password){
    newUserError.textContent = 'أدخل الاسم والبريد وكلمة المرور';
    newUserError.style.display = 'block';
    return;
  }
  if(password.length < 6){
    newUserError.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
    newUserError.style.display = 'block';
    return;
  }

  const btn = document.getElementById('createUserBtn');
  btn.disabled = true;
  // Use a secondary, isolated Firebase app instance so creating the new
  // account doesn't sign the current admin/manager out of their session.
  const secondaryApp = initializeApp(firebaseConfig, 'Secondary-' + Date.now());
  const secondaryAuth = getAuth(secondaryApp);
  try{
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password);
    await set(ref(db, 'users/' + cred.user.uid), {
      name, email, role, createdAt: Date.now()
    });
    await signOut(secondaryAuth);
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserEmail').value = '';
    document.getElementById('newUserPassword').value = '';
    showToast('تم إنشاء المستخدم');
  }catch(err){
    console.error(err);
    const map = {
      'auth/email-already-in-use': 'هذا البريد مستخدم بالفعل',
      'auth/invalid-email': 'صيغة البريد غير صحيحة',
      'auth/weak-password': 'كلمة المرور ضعيفة'
    };
    newUserError.textContent = map[err.code] || 'فشل إنشاء المستخدم';
    newUserError.style.display = 'block';
  }finally{
    try{ await deleteApp(secondaryApp); }catch(e){}
    btn.disabled = false;
  }
}
