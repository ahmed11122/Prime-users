<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقرير اليومي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef1f6;
    --card:#ffffff;
    --ink:#1e2530;
    --ink-soft:#7c8494;
    --line:#e1e5ec;
    --ok:#1f8a5f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    font-family:'IBM Plex Sans Arabic',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 18px 90px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    gap:16px; margin-bottom:26px; flex-wrap:wrap;
  }
  .title-block h1{
    font-family:'IBM Plex Sans Arabic'; font-weight:700; font-size:1.9rem; margin:0 0 4px;
    letter-spacing:.2px;
    color:var(--ink);
  }
  .title-block p{margin:0;color:var(--ink-soft);font-size:.9rem;font-weight:500;}

  .datebar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:10px 12px; box-shadow:0 1px 2px rgba(30,37,48,.04);
  }
  .datebar button{
    background:#f4f6fa; border:1px solid var(--line); color:var(--ink);
    border-radius:9px; padding:8px 13px; font-family:'IBM Plex Sans Arabic';font-weight:600;
    cursor:pointer; font-size:.85rem; transition:.15s;
  }
  .datebar button:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .datebar input[type="date"]{
    font-family:'IBM Plex Mono',monospace; border:1px solid var(--line);
    border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink);font-size:.85rem;
  }

  .status{
    font-size:.82rem;color:var(--ink-soft);min-height:1.2em; margin:6px 2px 20px;
  }
  .status.saved{color:var(--ok);font-weight:700;}

  /* Folder-tab cards */
  .entry{
    position:relative;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0 14px 14px 14px;
    margin:22px 0 0;
    box-shadow:0 1px 3px rgba(30,37,48,.05);
  }
  .entry .tab{
    position:absolute; top:-22px; inset-inline-start:0;
    display:flex; align-items:center; gap:8px;
    padding:7px 16px 9px;
    border-radius:10px 10px 0 0;
    font-family:'IBM Plex Sans Arabic'; font-weight:600; font-size:.94rem;
    color:#fff;
  }
  .entry .tab .dot{
    width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);
  }
  .entry .body{ padding:20px; }
  .entry textarea{
    width:100%; resize:none; overflow:hidden;
    background:transparent; border:none;
    font-family:'IBM Plex Sans Arabic'; font-size:1rem; color:var(--ink);
    line-height:1.9; min-height:44px;
  }
  .entry textarea:focus{outline:none;}
  .entry textarea::placeholder{color:#b7bdc9;}
  .print-text{
    display:none;
    font-family:'IBM Plex Sans Arabic', Arial, sans-serif; font-size:13pt; color:#1e2530;
    line-height:2; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word;
    direction:rtl; text-align:right;
  }

  .c1 .tab{background:#3b6fd1;} .c1{border-top:3px solid #3b6fd1;}
  .c2 .tab{background:#1f9e8c;} .c2{border-top:3px solid #1f9e8c;}
  .c3 .tab{background:#c98a1f;} .c3{border-top:3px solid #c98a1f;}
  .c4 .tab{background:#d15b4a;} .c4{border-top:3px solid #d15b4a;}
  .c5 .tab{background:#7a5bd1;} .c5{border-top:3px solid #7a5bd1;}
  .c6 .tab{background:#4a5568;} .c6{border-top:3px solid #4a5568;}
  .c7 .tab{background:#1e7d63;} .c7{border-top:3px solid #1e7d63;}

  .actions{
    position:sticky; bottom:16px; margin-top:30px;
    display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
    background:var(--bg); padding-top:12px;
  }
  .actions button{
    font-family:'IBM Plex Sans Arabic'; font-weight:600; font-size:.9rem;
    border-radius:999px; padding:12px 22px; border:none; cursor:pointer;
    transition:.15s; box-shadow:0 2px 8px rgba(30,37,48,.12);
  }
  #saveBtn{background:var(--ok);color:#fff;}
  #saveBtn:hover{filter:brightness(1.08);}
  #wordBtn{background:#3b6fd1;color:#fff;}
  #wordBtn:hover{filter:brightness(1.08);}
  #pdfBtn{background:#c0392b;color:#fff;}
  #pdfBtn:hover{filter:brightness(1.08);}
  #copyBtn{background:var(--ink);color:#fff;}
  #copyBtn:hover{filter:brightness(1.15);}
  #printBtn{background:#fff;color:var(--ink);border:1.5px solid var(--line) !important;box-shadow:none;}
  #printBtn:hover{background:#f4f6fa;}

  footer.note{text-align:center;color:var(--ink-soft);font-size:.78rem;margin-top:18px;}

  .closing{
    text-align:center; margin:34px 0 0; padding-top:18px;
    border-top:1px solid var(--line);
    font-family:'IBM Plex Sans Arabic'; font-weight:600; font-size:1.02rem;
    color:var(--ink);
  }

  @media (max-width:600px){
    .title-block h1{font-size:1.5rem;}
    .entry .body{padding:16px;}
  }

  @media print{
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; color-adjust:exact !important; }
    body{background:#fff;padding:0;}
    .datebar, .actions, footer.note, .status{display:none !important;}
    .entry{break-inside:avoid;box-shadow:none;margin-top:16px;border-color:#ccc;}
    .entry .tab{ position:static; border-radius:8px 8px 0 0; display:block; }
    .entry .body{ padding:14px 18px; }
    .entry textarea{display:none !important;}
    .print-text{display:block !important;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>التقرير اليومي</h1>
      <p id="dateLabel">—</p>
    </div>
  </header>

  <div class="datebar">
    <button id="prevDay">‹ السابق</button>
    <input type="date" id="datePicker">
    <button id="nextDay">التالي ›</button>
    <button id="todayBtn">اليوم</button>
  </div>
  <div class="status" id="status"></div>

  <div id="sections"></div>

  <p class="closing">ولكم الأمر مع التقدير</p>

  <div class="actions">
    <button id="saveBtn">💾 حفظ محليًا</button>
    <button id="wordBtn">📄 تصدير Word</button>
    <button id="pdfBtn">🧾 تصدير PDF</button>
    <button id="copyBtn">📋 نسخ كنص</button>
    <button id="printBtn">🖨️ طباعة</button>
  </div>

  <footer class="note">يُحفظ التقرير على هذا الجهاز فقط داخل المتصفح، ولا يُرسل لأي مكان. لتصدير PDF، اختر "حفظ كملف PDF" من نافذة الطباعة التي تظهر.</footer>
</div>

<script>
const SECTIONS = [
  {key:"done",   title:"الأعمال المنجزة اليوم",           placeholder:"اكتب الأعمال التي أنجزتها اليوم...", cls:"c1"},
  {key:"visits", title:"الزيارات والاجتماعات",             placeholder:"الزيارات، الاجتماعات، الحضور...", cls:"c2"},
  {key:"market", title:"متابعة العملاء والسوق",            placeholder:"متابعات العملاء، السوق، التجار...", cls:"c3"},
  {key:"issues", title:"المشاكل أو المعوقات",              placeholder:"أي مشاكل أو معوقات واجهتك...", cls:"c4"},
  {key:"agree",  title:"الإجراءات والاتفاقات",             placeholder:"الإجراءات المتخذة والاتفاقات...", cls:"c5"},
  {key:"admin",  title:"المطلوب من الإدارة (إن وجد)",      placeholder:"اكتب هنا أو اترك فارغًا إن لم يوجد...", cls:"c6"},
  {key:"plan",   title:"خطة عمل الغد",                     placeholder:"ما المخطط له غدًا...", cls:"c7"},
];

const sectionsEl = document.getElementById('sections');
SECTIONS.forEach((s) => {
  const div = document.createElement('div');
  div.className = 'entry ' + s.cls;
  div.innerHTML = `
    <div class="tab"><span class="dot"></span>${s.title}</div>
    <div class="body">
      <textarea id="ta-${s.key}" placeholder="${s.placeholder}" rows="1"></textarea>
      <div class="print-text" id="pt-${s.key}"></div>
    </div>
  `;
  sectionsEl.appendChild(div);
});

function autosize(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

const datePicker = document.getElementById('datePicker');
const dateLabel = document.getElementById('dateLabel');
const statusEl = document.getElementById('status');

function ymd(d){ return d.toISOString().slice(0,10); }
function toArabicLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('ar-EG', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

let currentDate = ymd(new Date());
let saveTimer = null;

function loadDay(dateStr){
  currentDate = dateStr;
  datePicker.value = dateStr;
  dateLabel.textContent = toArabicLabel(dateStr);

  SECTIONS.forEach(s => {
    const ta = document.getElementById('ta-'+s.key);
    ta.value = '';
    autosize(ta);
  });

  try{
    const raw = localStorage.getItem('report:' + dateStr);
    if(raw){
      const data = JSON.parse(raw);
      SECTIONS.forEach(s => {
        const ta = document.getElementById('ta-'+s.key);
        ta.value = data[s.key] || '';
        autosize(ta);
      });
      statusEl.textContent = 'تم تحميل تقرير محفوظ';
    } else {
      statusEl.textContent = 'لا يوجد تقرير محفوظ لهذا اليوم بعد';
    }
    statusEl.className = 'status';
  }catch(e){
    statusEl.textContent = 'لا يوجد تقرير محفوظ لهذا اليوم بعد';
    statusEl.className = 'status';
  }
}

function saveDay(showStatus = true){
  const data = {};
  SECTIONS.forEach(s => data[s.key] = document.getElementById('ta-'+s.key).value);
  try{
    localStorage.setItem('report:' + currentDate, JSON.stringify(data));
    if(showStatus){
      statusEl.textContent = '✓ تم الحفظ محليًا';
      statusEl.className = 'status saved';
    }
  }catch(e){
    statusEl.textContent = 'تعذّر الحفظ، حاول مجددًا';
    statusEl.className = 'status';
  }
}

SECTIONS.forEach(s => {
  const ta = document.getElementById('ta-'+s.key);
  ta.addEventListener('input', () => {
    autosize(ta);
    statusEl.textContent = 'جارٍ الكتابة...';
    statusEl.className = 'status';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveDay(true), 1200);
  });
});

document.getElementById('saveBtn').addEventListener('click', () => { clearTimeout(saveTimer); saveDay(true); });
document.getElementById('datePicker').addEventListener('change', (e) => loadDay(e.target.value));

document.getElementById('prevDay').addEventListener('click', () => {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  loadDay(ymd(d));
});
document.getElementById('nextDay').addEventListener('click', () => {
  const d = new Date(currentDate + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  loadDay(ymd(d));
});
document.getElementById('todayBtn').addEventListener('click', () => loadDay(ymd(new Date())));

document.getElementById('copyBtn').addEventListener('click', async () => {
  const lines = [`التقرير اليومي — ${toArabicLabel(currentDate)}`, ''];
  SECTIONS.forEach(s => {
    const val = document.getElementById('ta-'+s.key).value.trim();
    lines.push(s.title, val || '—', '');
  });
  lines.push('ولكم الأمر مع التقدير');
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    statusEl.textContent = '✓ تم نسخ التقرير';
    statusEl.className = 'status saved';
  }catch(e){
    statusEl.textContent = 'تعذّر النسخ التلقائي — انسخ يدويًا';
    statusEl.className = 'status';
  }
});

function fillPrintText(){
  SECTIONS.forEach(s => {
    const val = document.getElementById('ta-'+s.key).value.trim();
    document.getElementById('pt-'+s.key).textContent = val || '—';
  });
}
window.addEventListener('beforeprint', fillPrintText);

document.getElementById('printBtn').addEventListener('click', () => { fillPrintText(); window.print(); });

document.getElementById('pdfBtn').addEventListener('click', () => {
  const originalTitle = document.title;
  document.title = `التقرير-اليومي-${currentDate}`;
  fillPrintText();
  statusEl.textContent = 'اختر "حفظ كملف PDF" كوجهة الطباعة، ثم احفظ';
  statusEl.className = 'status';
  window.print();
  setTimeout(() => { document.title = originalTitle; }, 1000);
});

function rtfEscapeUnicode(str){
  let out = '';
  for (const ch of str) {
    const code = ch.codePointAt(0);
    if (ch === '\\' || ch === '{' || ch === '}') {
      out += '\\' + ch;
    } else if (ch === '\n') {
      out += '\\par ';
    } else if (code < 128) {
      out += ch;
    } else {
      const signed = code > 32767 ? code - 65536 : code;
      out += `\\u${signed}?`;
    }
  }
  return out;
}

document.getElementById('wordBtn').addEventListener('click', () => {
  try{
    const palette = {c1:[59,111,209],c2:[31,158,140],c3:[201,138,31],c4:[209,91,74],c5:[122,91,209],c6:[74,85,104],c7:[30,125,99]};
    let colorTable = '\\red0\\green0\\blue0;\\red124\\green132\\blue148;';
    const colorIndex = {};
    let idx = 2;
    SECTIONS.forEach(s => {
      const [r,g,b] = palette[s.cls];
      colorTable += `\\red${r}\\green${g}\\blue${b};`;
      colorIndex[s.cls] = idx++;
    });

    const titleRtf = rtfEscapeUnicode('التقرير اليومي');
    const dateRtf = rtfEscapeUnicode(toArabicLabel(currentDate));

    let body = `{\\pard\\rtlpar\\qr\\rtlch\\b\\fs40\\cf1 ${titleRtf}\\par}\n`;
    body += `{\\pard\\rtlpar\\qr\\rtlch\\fs22\\cf2 ${dateRtf}\\par}\n`;
    body += `{\\pard\\rtlpar\\brdrb\\brdrs\\brdrw10\\brsp20\\par}\n`;

    SECTIONS.forEach(s => {
      const val = document.getElementById('ta-'+s.key).value.trim() || '—';
      const cf = colorIndex[s.cls];
      body += `{\\pard\\rtlpar\\qr\\rtlch\\b\\fs26\\cf${cf}\\sb200\\sa80 ${rtfEscapeUnicode(s.title)}\\par}\n`;
      body += `{\\pard\\rtlpar\\qr\\rtlch\\b0\\fs22\\cf1\\sa200 ${rtfEscapeUnicode(val)}\\par}\n`;
    });
    body += `{\\pard\\rtlpar\\brdrt\\brdrs\\brdrw10\\brsp20\\par}\n`;
    body += `{\\pard\\rtlpar\\qr\\rtlch\\b\\fs24\\cf1\\sb200 ${rtfEscapeUnicode('ولكم الأمر مع التقدير')}\\par}\n`;

    const rtf = `{\\rtf1\\ansi\\ansicpg1256\\deff0\\deflang1025\\uc1
{\\fonttbl{\\f0\\fswiss Arial;}}
{\\colortbl;${colorTable}}
\\viewkind4\\pard\\rtlpar\\qr\\f0\\lang1025
${body}
}`;

    const blob = new Blob([rtf], { type: 'application/rtf' });
    const filename = `Daily-Report-${currentDate}.rtf`;

    if (window.navigator && window.navigator.msSaveOrOpenBlob) {
      window.navigator.msSaveOrOpenBlob(blob, filename);
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => {
        window.open(url, '_blank');
        URL.revokeObjectURL(url);
      }, 150);
    }

    statusEl.textContent = '✓ تم تصدير ملف Word (RTF) — يفتح مباشرة في Word';
    statusEl.className = 'status saved';
  }catch(e){
    statusEl.textContent = 'تعذّر تصدير الملف في هذا المتصفح، جرّب متصفحًا آخر';
    statusEl.className = 'status';
  }
});

loadDay(currentDate);
</script>
</body>
</html>
