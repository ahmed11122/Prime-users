<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة حسابات الموظفين</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0f1416;
    --panel: #161d20;
    --panel-2: #1c2427;
    --line: #26302f;
    --ink: #eef2f0;
    --ink-dim: #9fb0ab;
    --accent: #3fae7a;
    --accent-2: #2e8c62;
    --amber: #d9a441;
    --red: #c85c4a;
    --radius: 10px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Tajawal', sans-serif;
    min-height:100vh;
    padding: 32px 20px 80px;
  }

  .wrap{ max-width: 980px; margin: 0 auto; }

  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom: 28px; gap:16px; flex-wrap:wrap;
  }
  header .title-block{ display:flex; flex-direction:column; gap:4px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.12em;
    color: var(--accent); text-transform:uppercase;
  }
  h1{ margin:0; font-size:28px; font-weight:900; }
  .stats{
    display:flex; gap:10px; font-family:'IBM Plex Mono', monospace; font-size:13px;
  }
  .stat{
    background: var(--panel); border:1px solid var(--line); border-radius: var(--radius);
    padding: 10px 16px; text-align:center; min-width:84px;
  }
  .stat b{ display:block; font-size:20px; color:var(--accent); font-weight:700; }
  .stat span{ color: var(--ink-dim); font-size:11px; }

  .toolbar{
    display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .btn{
    font-family:'Tajawal', sans-serif; font-weight:700; font-size:14px;
    border-radius: 8px; border:1px solid var(--line); cursor:pointer;
    padding: 10px 18px; background: var(--panel-2); color: var(--ink);
    transition: all .15s ease;
  }
  .btn:hover{ border-color: var(--accent); }
  .btn.primary{ background: var(--accent); border-color: var(--accent); color:#08130d; }
  .btn.primary:hover{ background: var(--accent-2); }
  .btn.ghost{ background:transparent; }
  .btn:active{ transform: scale(.97); }

  .search{
    flex:1; min-width:200px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 10px 14px; color: var(--ink); font-family:'Tajawal'; font-size:14px;
  }
  .search::placeholder{ color: var(--ink-dim); }
  .search:focus{ outline:none; border-color:var(--accent); }

  .employee{
    background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    margin-bottom: 16px; overflow:hidden;
  }
  .employee-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px; cursor:pointer; gap:12px; flex-wrap:wrap;
  }
  .employee-name{
    display:flex; align-items:center; gap:12px; font-size:17px; font-weight:700;
  }
  .avatar{
    width:38px; height:38px; border-radius:50%; background: var(--panel-2);
    display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono';
    font-size:14px; color: var(--accent); border:1px solid var(--line); flex-shrink:0;
  }
  .progress-mini{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-dim);
    display:flex; align-items:center; gap:8px;
  }
  .bar{ width:90px; height:6px; border-radius:4px; background: var(--panel-2); overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; background: var(--accent); transition: width .3s ease; }

  .head-actions{ display:flex; gap:8px; align-items:center; }
  .icon-btn{
    background:transparent; border:1px solid var(--line); color:var(--ink-dim);
    border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color: var(--red); color: var(--red); }
  .chevron{ transition: transform .2s ease; color: var(--ink-dim); }
  .employee.open .chevron{ transform: rotate(180deg); }

  .accounts{
    display:none; padding: 0 20px 18px; border-top:1px solid var(--line);
  }
  .employee.open .accounts{ display:block; }

  .account-row{
    display:flex; align-items:center; gap:10px; padding: 12px 0;
    border-bottom: 1px dashed var(--line); flex-wrap:wrap;
  }
  .account-row:last-of-type{ border-bottom:none; }

  .account-row.checked{ opacity:.55; }

  .cred{
    font-family:'IBM Plex Mono', monospace; font-size:13px;
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding: 8px 12px; display:flex; align-items:center; gap:8px; flex:1; min-width:160px;
  }
  .cred .label{ color: var(--ink-dim); font-size:11px; }
  .cred .val{ color: var(--ink); }

  .copy-btn{
    background: transparent; border:1px solid var(--line); color: var(--accent);
    border-radius:6px; padding:8px 10px; cursor:pointer; font-size:12px;
    font-family:'Tajawal'; font-weight:700;
  }
  .copy-btn:hover{ background: var(--accent); color:#08130d; }
  .copy-btn.copied{ background: var(--accent); color:#08130d; }

  .toggle-status{
    border:1px solid var(--line); border-radius: 20px; padding: 7px 14px;
    cursor:pointer; font-size:12px; font-weight:700; font-family:'Tajawal';
    display:flex; align-items:center; gap:6px; background:var(--panel-2); color:var(--ink-dim);
    white-space:nowrap;
  }
  .toggle-status .dot{ width:8px; height:8px; border-radius:50%; background: var(--ink-dim); }
  .toggle-status.done{ border-color: var(--accent); color: var(--accent); }
  .toggle-status.done .dot{ background: var(--accent); }

  .del-account{
    background:transparent; border:none; color: var(--ink-dim); cursor:pointer;
    font-size:16px; width:28px; height:28px; border-radius:6px;
  }
  .del-account:hover{ color: var(--red); background: rgba(200,92,74,.1); }

  .add-account-row{
    display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;
  }
  .add-account-row input{
    background: var(--panel-2); border:1px solid var(--line); border-radius:6px;
    padding: 9px 12px; color: var(--ink); font-family:'IBM Plex Mono', monospace;
    font-size:13px; flex:1; min-width:130px;
  }
  .add-account-row input:focus{ outline:none; border-color:var(--accent); }

  .empty-accounts{
    color: var(--ink-dim); font-size:13px; padding: 16px 0; text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }

  .empty-state{
    text-align:center; padding: 60px 20px; color: var(--ink-dim);
  }
  .empty-state .big{ font-size:40px; margin-bottom:12px; }

  .alert-banner{
    display:none; align-items:center; gap:12px;
    background: rgba(217,164,65,.12); border:1px solid var(--amber); color: var(--amber);
    border-radius: 12px; padding: 14px 18px; margin-bottom: 18px; font-size:14px;
  }
  .alert-banner.show{ display:flex; }
  .alert-banner .ico{ font-size:20px; flex-shrink:0; }
  .alert-banner .txt b{ font-weight:900; }
  .alert-banner .txt div{ color: var(--ink-dim); font-size:12.5px; margin-top:2px; }

  .account-row:not(.checked){
    border-right: 3px solid var(--amber); padding-right:10px;
  }

  .modal-backdrop{
    display:none; position:fixed; inset:0; background: rgba(0,0,0,.6);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-backdrop.show{ display:flex; }
  .modal{
    background: var(--panel); border:1px solid var(--line); border-radius:14px;
    padding: 24px; width:100%; max-width:360px;
  }
  .modal h3{ margin:0 0 16px; font-size:17px; }
  .modal input{
    width:100%; background: var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding: 11px 14px; color: var(--ink); font-family:'Tajawal'; font-size:14px; margin-bottom:12px;
  }
  .modal input:focus{ outline:none; border-color: var(--accent); }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--accent); color:#08130d; padding: 10px 20px; border-radius:8px;
    font-weight:700; font-size:13px; opacity:0; pointer-events:none; transition: all .25s ease;
    z-index:100; font-family:'Tajawal';
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:520px){
    h1{ font-size:22px; }
    .stats{ width:100%; }
    .stat{ flex:1; }
  }
</style>
</head>
<body>

<!-- Login screen -->
<div class="modal-backdrop show" id="loginScreen">
  <div class="modal" style="max-width:340px;">
    <h3>تسجيل الدخول</h3>
    <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" autocomplete="username">
    <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
    <div id="loginError" style="color:var(--red); font-size:13px; margin-bottom:10px; display:none;"></div>
    <div class="modal-actions">
      <button class="btn primary" id="loginBtn" style="width:100%;">دخول</button>
    </div>
  </div>
</div>

<div class="wrap" id="appWrap" style="display:none;">
  <header>
    <div class="title-block">
      <span class="eyebrow">متابعة يومية · Account Check</span>
      <h1>متابعة حسابات الموظفين</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="statTotal">0</b><span>إجمالي الحسابات</span></div>
      <div class="stat"><b id="statDone">0</b><span>تم الفحص</span></div>
      <div class="stat"><b id="statPending">0</b><span>متبقي</span></div>
    </div>
  </header>
  <div class="toolbar" style="margin-bottom:8px;">
    <button class="btn ghost" id="logoutBtn" style="margin-inline-start:auto;">تسجيل الخروج</button>
  </div>

  <div class="alert-banner" id="alertBanner">
    <span class="ico">⚠️</span>
    <div class="txt">
      <b id="alertHeadline"></b>
      <div id="alertDetail"></div>
    </div>
  </div>

  <div class="toolbar">
    <input class="search" id="searchBox" placeholder="ابحث عن موظف...">
    <button class="btn primary" id="addEmployeeBtn">+ إضافة موظف</button>
    <button class="btn ghost" id="expandAllBtn">توسيع الكل</button>
    <button class="btn ghost" id="collapseAllBtn">طي الكل</button>
  </div>

  <div id="employeeList"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="big">👥</div>
    لا يوجد موظفين بعد — ابدأ بإضافة أول موظف
  </div>
</div>

<div class="modal-backdrop" id="employeeModal">
  <div class="modal">
    <h3>إضافة موظف جديد</h3>
    <input type="text" id="newEmployeeName" placeholder="اسم الموظف">
    <div class="modal-actions">
      <button class="btn ghost" id="cancelEmployee">إلغاء</button>
      <button class="btn primary" id="confirmEmployee">إضافة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, doc, setDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCOW-1qomcfqmjg7qFEBNaZDV7vkJ-4Zjo",
  authDomain: "prime-users.firebaseapp.com",
  databaseURL: "https://prime-users-default-rtdb.firebaseio.com",
  projectId: "prime-users",
  storageBucket: "prime-users.firebasestorage.app",
  messagingSenderId: "643551414414",
  appId: "1:643551414414:web:045a53d9ed7fa23324a1df",
  measurementId: "G-T7E4FV9GGJ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// The whole employees list lives in a single Firestore document.
const dataDocRef = doc(db, 'appData', 'employees');

let employees = [];
let openState = {};
let unsubscribeSnapshot = null;
let isRemoteUpdate = false; // guard so our own writes don't re-trigger a jarring reload

function saveData(data){
  isRemoteUpdate = true;
  setDoc(dataDocRef, { list: data }).catch(err=>{
    console.error('Firestore save failed:', err);
    showToast('فشل الحفظ، تحقق من الاتصال');
  });
}

// ---- Auth wiring ----
const loginScreen = document.getElementById('loginScreen');
const appWrap = document.getElementById('appWrap');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const loginEmail = document.getElementById('loginEmail');
const loginPassword = document.getElementById('loginPassword');
const logoutBtn = document.getElementById('logoutBtn');

loginBtn.addEventListener('click', doLogin);
loginPassword.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') doLogin(); });

function doLogin(){
  loginError.style.display = 'none';
  const email = loginEmail.value.trim();
  const password = loginPassword.value;
  if(!email || !password){
    loginError.textContent = 'أدخل البريد الإلكتروني وكلمة المرور';
    loginError.style.display = 'block';
    return;
  }
  loginBtn.disabled = true;
  signInWithEmailAndPassword(auth, email, password)
    .catch(err=>{
      loginError.textContent = 'فشل تسجيل الدخول: تحقق من البيانات';
      loginError.style.display = 'block';
    })
    .finally(()=>{ loginBtn.disabled = false; });
}

logoutBtn.addEventListener('click', ()=>{
  signOut(auth);
});

onAuthStateChanged(auth, (user)=>{
  if(user){
    loginScreen.classList.remove('show');
    appWrap.style.display = 'block';
    startListening();
  } else {
    appWrap.style.display = 'none';
    loginScreen.classList.add('show');
    if(unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
    employees = [];
  }
});

function startListening(){
  if(unsubscribeSnapshot) return;
  unsubscribeSnapshot = onSnapshot(dataDocRef, (snap)=>{
    if(isRemoteUpdate){
      // this snapshot is just confirming our own write; skip re-render to avoid flicker
      isRemoteUpdate = false;
      return;
    }
    const data = snap.exists() ? snap.data() : { list: [] };
    employees = data.list || [];
    render();
  }, (err)=>{
    console.error('Firestore listen failed:', err);
    showToast('تعذر تحميل البيانات');
  });
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 1600);
}

function initials(name){
  const parts = name.trim().split(/\s+/);
  return parts.slice(0,2).map(p=>p[0]).join('').toUpperCase();
}

function render(){
  const listEl = document.getElementById('employeeList');
  const emptyEl = document.getElementById('emptyState');
  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  const filtered = employees.filter(e => e.name.toLowerCase().includes(query));

  if(employees.length === 0){
    emptyEl.style.display = 'block';
    listEl.innerHTML = '';
  } else {
    emptyEl.style.display = 'none';
    listEl.innerHTML = filtered.map(emp => renderEmployee(emp)).join('');
  }

  // stats
  let total=0, done=0;
  employees.forEach(e => e.accounts.forEach(a => { total++; if(a.checked) done++; }));
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statPending').textContent = total - done;

  updateAlertBanner();
  attachEvents();
}

function updateAlertBanner(){
  const banner = document.getElementById('alertBanner');
  const pendingByEmp = employees
    .map(e => ({ name: e.name, count: e.accounts.filter(a=>!a.checked).length }))
    .filter(e => e.count > 0);

  const totalPending = pendingByEmp.reduce((s,e)=>s+e.count, 0);

  if(totalPending === 0){
    banner.classList.remove('show');
    return;
  }

  document.getElementById('alertHeadline').textContent =
    `يوجد ${totalPending} حساب لم يتم فحصه بعد`;
  document.getElementById('alertDetail').textContent =
    pendingByEmp.map(e => `${e.name} (${e.count})`).join(' · ');
  banner.classList.add('show');
}

function renderEmployee(emp){
  const isOpen = !!openState[emp.id];
  const total = emp.accounts.length;
  const done = emp.accounts.filter(a=>a.checked).length;
  const pct = total ? Math.round((done/total)*100) : 0;

  const accountsHtml = emp.accounts.length ? emp.accounts.map(acc => `
    <div class="account-row ${acc.checked?'checked':''}" data-emp="${emp.id}" data-acc="${acc.id}">
      <div class="cred">
        <span class="label">اسم المستخدم</span>
        <span class="val">${escapeHtml(acc.username)}</span>
        <button class="copy-btn" data-copy="${escapeAttr(acc.username)}">نسخ</button>
      </div>
      <div class="cred">
        <span class="label">كلمة المرور</span>
        <span class="val">${escapeHtml(acc.password)}</span>
        <button class="copy-btn" data-copy="${escapeAttr(acc.password)}">نسخ</button>
      </div>
      <button class="toggle-status ${acc.checked?'done':''}" data-emp="${emp.id}" data-acc="${acc.id}" data-action="toggle">
        <span class="dot"></span> ${acc.checked ? 'تم الفحص' : 'لم يُفحص'}
      </button>
      <button class="del-account" data-emp="${emp.id}" data-acc="${acc.id}" data-action="delAccount" title="حذف الحساب">✕</button>
    </div>
  `).join('') : `<div class="empty-accounts">لا توجد حسابات لهذا الموظف بعد</div>`;

  return `
    <div class="employee ${isOpen?'open':''}" data-emp="${emp.id}">
      <div class="employee-head" data-action="toggleEmployee" data-emp="${emp.id}">
        <div class="employee-name">
          <div class="avatar">${initials(emp.name)}</div>
          <span>${escapeHtml(emp.name)}</span>
        </div>
        <div class="progress-mini">
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span>${done}/${total}</span>
          <span class="chevron">▾</span>
        </div>
        <div class="head-actions">
          <button class="icon-btn" data-action="deleteEmployee" data-emp="${emp.id}" title="حذف الموظف">🗑</button>
        </div>
      </div>
      <div class="accounts">
        ${accountsHtml}
        <div class="add-account-row">
          <input type="text" placeholder="اسم المستخدم" class="newUsername" data-emp="${emp.id}">
          <input type="text" placeholder="كلمة المرور" class="newPassword" data-emp="${emp.id}">
          <button class="btn primary" data-action="addAccount" data-emp="${emp.id}">+ إضافة حساب</button>
        </div>
      </div>
    </div>
  `;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  return String(str).replace(/"/g,'&quot;');
}

function attachEvents(){
  document.querySelectorAll('[data-action="toggleEmployee"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.icon-btn')) return;
      const id = el.dataset.emp;
      openState[id] = !openState[id];
      render();
    });
  });

  document.querySelectorAll('[data-action="deleteEmployee"]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.dataset.emp;
      const emp = employees.find(x=>x.id===id);
      if(confirm(`هل تريد حذف "${emp.name}" وكل حساباته؟`)){
        employees = employees.filter(x=>x.id!==id);
        saveData(employees);
        render();
        showToast('تم حذف الموظف');
      }
    });
  });

  document.querySelectorAll('[data-action="toggle"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp, accId = el.dataset.acc;
      const emp = employees.find(x=>x.id===empId);
      const acc = emp.accounts.find(x=>x.id===accId);
      acc.checked = !acc.checked;
      saveData(employees);
      render();
    });
  });

  document.querySelectorAll('[data-action="delAccount"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp, accId = el.dataset.acc;
      const emp = employees.find(x=>x.id===empId);
      emp.accounts = emp.accounts.filter(x=>x.id!==accId);
      saveData(employees);
      render();
      showToast('تم حذف الحساب');
    });
  });

  document.querySelectorAll('.copy-btn').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const text = el.dataset.copy;
      try{
        await navigator.clipboard.writeText(text);
      }catch(e){
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      const original = el.textContent;
      el.textContent = 'تم!';
      el.classList.add('copied');
      setTimeout(()=>{ el.textContent = original; el.classList.remove('copied'); }, 1200);
    });
  });

  document.querySelectorAll('[data-action="addAccount"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const empId = el.dataset.emp;
      const uInput = document.querySelector(`.newUsername[data-emp="${empId}"]`);
      const pInput = document.querySelector(`.newPassword[data-emp="${empId}"]`);
      const username = uInput.value.trim();
      const password = pInput.value.trim();
      if(!username || !password){
        showToast('أدخل اسم المستخدم وكلمة المرور');
        return;
      }
      const emp = employees.find(x=>x.id===empId);
      emp.accounts.push({ id: uid(), username, password, checked:false });
      saveData(employees);
      openState[empId] = true;
      render();
      showToast('تمت إضافة الحساب');
    });
  });

  // allow Enter key to submit account
  document.querySelectorAll('.newUsername, .newPassword').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){
        const empId = inp.dataset.emp;
        document.querySelector(`[data-action="addAccount"][data-emp="${empId}"]`).click();
      }
    });
  });
}

// Add employee modal
const modal = document.getElementById('employeeModal');
document.getElementById('addEmployeeBtn').addEventListener('click', ()=>{
  modal.classList.add('show');
  document.getElementById('newEmployeeName').value = '';
  document.getElementById('newEmployeeName').focus();
});
document.getElementById('cancelEmployee').addEventListener('click', ()=>{
  modal.classList.remove('show');
});
modal.addEventListener('click', (e)=>{ if(e.target === modal) modal.classList.remove('show'); });

document.getElementById('confirmEmployee').addEventListener('click', addEmployee);
document.getElementById('newEmployeeName').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') addEmployee();
});

function addEmployee(){
  const name = document.getElementById('newEmployeeName').value.trim();
  if(!name){ showToast('أدخل اسم الموظف'); return; }
  employees.push({ id: uid(), name, accounts: [] });
  saveData(employees);
  modal.classList.remove('show');
  render();
  showToast('تمت إضافة الموظف');
}

document.getElementById('searchBox').addEventListener('input', render);

document.getElementById('expandAllBtn').addEventListener('click', ()=>{
  employees.forEach(e => openState[e.id] = true);
  render();
});
document.getElementById('collapseAllBtn').addEventListener('click', ()=>{
  openState = {};
  render();
});
</script>
</body>
</html>
